<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <title>Platform asset smoke</title>
    <link rel="stylesheet" href="/static/platform/basecoat-factory.min.css">
    <script src="/static/platform/basecoat-js.min.js" defer></script>
    <script src="/static/platform/htmx.min.js" defer></script>
    <script src="/static/platform/alpine.min.js" defer></script>
  </head>
  <body>
    <div class="app-shell">
      <aside id="sidebar" class="sidebar app-sidebar">
        <nav aria-label="Platform">
          <a href="/login">Login</a>
          <a href="/account">Account</a>
          <a href="/admin">Admin</a>
        </nav>
      </aside>
      <main id="app-main" class="app-main">
        <header id="app-main-header" class="app-main-header">
          <button type="button" data-sidebar-toggle aria-label="Toggle sidebar">Menu</button>
        </header>
        <section id="main-content" class="app-main-content">
          <article class="card app-state-page__card" x-data="{ ready: false }">
            <h1 id="surface-title"></h1>
            <button id="alpine-toggle" class="btn" type="button" @click="ready = true">Initialize</button>
            <span id="alpine-result" x-show="ready" x-cloak>Alpine ready</span>
            <button id="htmx-trigger" class="btn" type="button" hx-get="/smoke/fragment" hx-target="#htmx-result">Load fragment</button>
            <div id="htmx-result"></div>
          </article>
        </section>
      </main>
    </div>
    <script>
      document.querySelector("#surface-title").textContent = {
        "/login": "Login",
        "/account": "Account",
        "/admin": "Admin users",
      }[location.pathname] || "Platform shell";
    </script>
  </body>
</html>
